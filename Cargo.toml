[workspace]
resolver = "2"
members = [
    "crates/rosm_core",
    "crates/rosm_io",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ROSM Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tau2c/ROSM"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
quick-xml = "0.37"
